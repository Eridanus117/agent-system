  - id: "epic-1-retro-item-3-readyesno-s-readline-packages-control-pl"
    epic: 1
    action: "readYesNo's readLine() (packages/control-plane/src/cli/confirm-prompt.ts)
      only registers stdin.once('data', ...) with no 'end'/'error' handler, so configs
      use/switch hangs forever on premature stdin EOF (e.g. piped from /dev/null,
      non-interactive invocation without --yes) instead of failing fast. Verified
      directly by reading the source. Add stdin.once('end'/'error', ...) resolving
      to an empty (rejecting) answer."
    owner: "control-plane maintainer"
    status: done
    ref: "_bmad-output/implementation-artifacts/epic-1-retro-2026-08-22.md"
