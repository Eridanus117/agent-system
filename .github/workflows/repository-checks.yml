name: Existing repository checks

# `packages/**`、`package.json`、`bun.lock` 曾在 paths-ignore 里。Story 3.6 起不再
# 忽略：本 workflow 现在包含「本仓装配意图一致性门」，而那道门调用的是
# `packages/control-plane` 里真实的 `configs supply` CLI。忽略 `packages/**` 会让
# 一个只改 CLI 的 PR 绕过这道门——门的意义正在于此时报警。
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/control-plane-checks.yml"
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/control-plane-checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # 装配意图一致性门要起真实的 `configs supply` 子进程（Bun + control-plane
      # 的依赖），所以这个此前只装 Python 的 job 现在也要 Bun。
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check federated entry contract
        run: python scripts/test_federated_entry.py

      - name: Check repository entry projections
        run: python -m scripts.entry_sync check --scope repository

      # 真跑，不是只注册：推导本仓装配意图并用真实 `configs supply` 校验。
      - name: Check assembly intent consistency
        run: python tools/assembly_intent/assembly_intent.py

      - name: Test assembly intent
        run: python -m unittest discover -s tools/assembly_intent/tests -v

      - name: Test dispatch deadlines
        run: python -m unittest discover -s tools/dispatch_deadlines/tests -v

      - name: Test sibling facts
        run: python -m unittest discover -s tools/sibling-facts/tests -v

      - name: Test operations console
        run: python -m unittest discover -s tools/ops-console/tests -v

      - name: Test report formats
        run: python -m unittest discover -s tools/report_formats/tests -v

      # 只跑纯逻辑与合成夹具；三端安装态的实测项按 os.name 跳过——那是本机事实。
      - name: Test plugin release
        run: python -m unittest discover -s tools/plugin_release/tests -v

      # Installed targets use machine-specific absolute paths that do not exist
      # on GitHub-hosted runners. Validate them locally instead with:
      # python -m scripts.entry_sync check --scope installed
