name: Packages checks

# 三个 Bun 包（control-plane、harness-engine、sk）的 PR 门禁统一在这一条工作流：
# 包 × 平台矩阵，仓库根装一次依赖，各作业进包目录跑 package.json 里的 typecheck 与 test。
# 方案与裁决见 PR #41。

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        package: [control-plane, harness-engine, sk]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # workspace 依赖（harness-engine 依赖 control-plane）要求在仓库根安装。
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck
        working-directory: packages/${{ matrix.package }}

      - name: Run tests
        run: bun run test
        working-directory: packages/${{ matrix.package }}
