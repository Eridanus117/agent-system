name: Skill asset checks

# 守一条不变量，只校验版本化来源，不代表任何运行端已安装或生效：
#   Skill 资产面（tools/skill_registry）与选型面（plugins/docs/skills-overview.md）
#   对同一批 Skill 的 L1 读数一致，且 registry.md 与其来源没有漂移。
# 原「两份 IDE 副本逐字节相同」不变量已于 2026-08-25 退役；
# vendor/bmad 已于 2026-09-01 随负责人裁定整组退库。

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/skill_registry/**"
      - "plugins/**"
      - ".github/workflows/skill-asset-checks.yml"
  push:
    branches:
      - main
    paths:
      - "tools/skill_registry/**"
      - "plugins/**"
      - ".github/workflows/skill-asset-checks.yml"

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Node 原生剥离 TypeScript 类型，无构建、无依赖。固定 24：24 起无需 flag。
      # 与 plugins/tests 的两份检查同一条件。
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check skill registry cross-reads and generated output
        run: node tools/skill_registry/skill-registry.ts --check
