name: Harness engine checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/harness-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # harness-engine 通过 workspace 依赖 control-plane，安装必须在仓库根执行。
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Type check
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Run tests
        run: bun test tests
