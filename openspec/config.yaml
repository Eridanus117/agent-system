schema: delivery-change

context: |
  本仓维护可公开复用的 Agent 系统原则、协议、合同、Plugin、profile 装配和验证工具。
  OpenSpec Change、长期 capability specs 与交付证据保存在本仓，不使用外置私人 Spec 仓。
  产品权威收敛到 openspec/specs/ 与仓内版本化文档；_bmad-output/ 已于 2026-09-02 整体删除，
  不再作为任何权威或迁移来源。
  新持久实现使用 Go、Python、TypeScript 或 Rust；当前控制面基线为 TypeScript/Bun。
  人工审阅产物使用中文；机器 slug、JSON 字段、命令、路径和配置键保持稳定英文标识。
  公开仓不得保存个人状态、私人研究原文、账号、凭据、环境秘密或其他信任域真实资产。

rules:
  raw-requirements:
    - 标明公开、自足的来源、时间、位置和完整性，不从私有旧仓或历史材料恢复当前授权
  specs:
    - 每项 Requirement 至少包含一个可观测 Scenario，并覆盖正向与负向触发
  business-current:
    - 区分当前公共产品行为、历史资产和尚未采用的候选，不把文件存在等同于当前能力
  technical-current:
    - 区分声明态、配置态和实际生效态，记录版本、接口、失败语义与可复现证据
  change-plan:
    - 说明 OpenSpec 与仓内文档的权威落位、范围、非目标、回滚边界和公开仓信息边界
  test-plan:
    - 覆盖合同、跨客户端实际生效态、失败路径和回滚；没有前后证据时不得声称行为改善
  tasks:
    - task-state.json 是状态真源，07-实施任务/实施任务.md 只作为人工阅读视图
  acceptance:
    - delivery 模式必须全部任务 verified，并保存实际 run-id 或等价可重放证据后才能 PASS
  release:
    - 未经负责人明确授权不得发布、同步、归档或改变 GitHub 生命周期
